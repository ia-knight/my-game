<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Knight AI Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080d;--side:#0d0f17;--panel:#131621;--panel2:#1a1e2d;--line:#252a3d;--text:#e9ecf6;--muted:#8a92ab;--a:#8b7bff;--a2:#4fd1c5;--user:#1d2140;--bad:#ff5d6c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Cairo',system-ui,sans-serif;display:flex;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}

/* Sidebar */
aside{width:330px;flex:none;background:var(--side);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;height:100%;transition:transform .25s;z-index:30}
.brand{padding:18px 18px 12px;display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--a),var(--a2));display:grid;place-items:center;font-weight:800;color:#07080d;font-size:1.1rem}
.brand b{font-size:1.1rem;direction:ltr;letter-spacing:.3px}
.brand small{display:block;color:var(--muted);font-size:.72rem}
.tabs{display:flex;margin:0 14px;background:var(--panel);border-radius:11px;padding:4px}
.tabs button{flex:1;padding:8px;border-radius:8px;color:var(--muted);font-weight:600;font-size:.9rem}
.tabs button.on{background:var(--panel2);color:var(--text)}
.pane{flex:1;overflow-y:auto;padding:14px;display:none}
.pane.on{display:block}
.new{width:100%;padding:11px;border-radius:11px;background:linear-gradient(135deg,var(--a),#6c5ce7);font-weight:700;margin-bottom:12px}
.chat-item{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:9px;color:var(--muted);cursor:pointer;margin-bottom:3px}
.chat-item:hover{background:var(--panel)}
.chat-item.on{background:var(--panel2);color:var(--text)}
.chat-item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9rem}
.chat-item button{opacity:0;color:var(--bad);padding:2px 6px}
.chat-item:hover button{opacity:1}
.field{margin-bottom:18px}
.field label{display:flex;justify-content:space-between;font-size:.85rem;font-weight:600;margin-bottom:7px}
.field label em{font-style:normal;color:var(--a2);font-family:'JetBrains Mono',monospace}
.field small{display:block;color:var(--muted);font-size:.75rem;margin-top:6px;line-height:1.6}
input[type=text],input[type=password],select,textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.9rem}
input[type=text],input[type=password]{direction:ltr;text-align:left}
textarea{resize:vertical;min-height:130px;line-height:1.7}
input[type=range]{width:100%;accent-color:var(--a);direction:ltr}
.row{display:flex;gap:8px}
.mini{padding:8px 12px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-size:.8rem;font-weight:600;white-space:nowrap}
.mini:hover{border-color:var(--a)}
.eye{flex:none}
.status{font-size:.78rem;margin-top:6px;color:var(--muted)}

/* Main */
main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
header{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);background:#0a0c13cc;backdrop-filter:blur(8px)}
.burger{display:none;font-size:1.4rem;padding:2px 8px}
header h2{font-size:1rem;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .model{color:var(--muted);font-size:.75rem;direction:ltr;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#msgs{flex:1;overflow-y:auto;padding:26px 0 10px;scroll-behavior:smooth}
.col{max-width:820px;margin:0 auto;padding:0 18px}
.msg{display:flex;gap:12px;margin-bottom:22px}
.av{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:.85rem;font-weight:800}
.msg.user .av{background:var(--user);color:var(--a)}
.msg.assistant .av{background:linear-gradient(135deg,var(--a),var(--a2));color:#07080d}
.body{flex:1;min-width:0;line-height:1.95;font-size:.98rem;overflow-wrap:anywhere}
.msg.user .body{background:var(--user);padding:10px 16px;border-radius:14px;flex:0 1 auto;max-width:85%;white-space:pre-wrap}
.msg.user{flex-direction:row}
.body p{margin:0 0 .7em}.body h1,.body h2,.body h3{margin:.8em 0 .4em;line-height:1.4}
.body ul,.body ol{padding-inline-start:1.4em;margin:0 0 .8em}
.body a{color:var(--a2)}
.body code.i{background:var(--panel2);padding:1px 6px;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:.85em;direction:ltr;unicode-bidi:embed}
.code{margin:.6em 0 1em;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0a0c14;direction:ltr}
.code .bar{display:flex;justify-content:space-between;align-items:center;background:var(--panel);padding:6px 12px;font-size:.75rem;color:var(--muted);font-family:'JetBrains Mono',monospace}
.code .copy{display:flex;align-items:center;gap:6px;padding:3px 10px;border-radius:7px;color:var(--text);font-family:'Cairo';font-size:.78rem}
.code .copy:hover{background:var(--panel2)}.code .copy.done{color:var(--a2)}
.code pre{padding:14px;overflow-x:auto;font-family:'JetBrains Mono',monospace;font-size:.84rem;line-height:1.65;text-align:left}
.cursor{display:inline-block;width:8px;height:1em;background:var(--a);vertical-align:text-bottom;animation:bl 1s steps(2) infinite;margin-inline-start:3px}
@keyframes bl{50%{opacity:0}}
.err{color:var(--bad);border:1px solid #6b2a33;background:#2a1519;padding:10px 14px;border-radius:10px;line-height:1.7}
.welcome{text-align:center;padding:9vh 10px 0}
.welcome .logo{width:68px;height:68px;font-size:2rem;border-radius:20px;margin:0 auto 18px;box-shadow:0 12px 50px #8b7bff44}
.welcome h1{font-size:2rem;font-weight:800;margin-bottom:8px}
.welcome p{color:var(--muted);line-height:1.9}
.sugg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:26px;text-align:start}
.sugg button{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;line-height:1.6;font-size:.9rem;color:var(--muted);text-align:start}
.sugg button:hover{border-color:var(--a);color:var(--text)}

/* Composer */
.composer{padding:10px 18px calc(16px + env(safe-area-inset-bottom))}
.box{max-width:820px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;display:flex;align-items:flex-end;gap:8px;padding:8px 10px;transition:border-color .2s}
.box:focus-within{border-color:var(--a)}
.box textarea{border:0;background:none;min-height:0;max-height:200px;resize:none;padding:8px;flex:1;outline:none}
.send{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--a),#6c5ce7);display:grid;place-items:center;flex:none}
.send.stop{background:var(--bad)}
.send svg{width:20px;height:20px}
.tools{max-width:820px;margin:8px auto 0;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tools button{color:var(--muted);font-size:.78rem;padding:4px 10px;border-radius:8px}
.tools button:hover{color:var(--text);background:var(--panel)}
.scrim{display:none}
@media(max-width:820px){
 aside{position:fixed;inset:0 0 0 auto;width:min(340px,88vw);transform:translateX(100%);box-shadow:-10px 0 40px #000a}
 aside.open{transform:none}
 .scrim.show{display:block;position:fixed;inset:0;background:#000a;z-index:20}
 .burger{display:block}header .model{display:none}
 .msg.user .body{max-width:92%}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<aside id="side">
  <div class="brand"><div class="logo">K</div><div><b>Knight AI Studio</b><small>مساعدك الذكي الخاص</small></div></div>
  <div class="tabs"><button class="on" data-t="chats">المحادثات</button><button data-t="set">الإعدادات</button></div>

  <div class="pane on" id="p-chats">
    <button class="new" id="newChat">+ محادثة جديدة</button>
    <div id="chatList"></div>
  </div>

  <div class="pane" id="p-set">
    <div class="field">
      <label for="key">مفتاح OpenRouter API</label>
      <div class="row"><input type="password" id="key" placeholder="sk-or-v1-..." autocomplete="off"><button class="mini eye" id="eye" aria-label="إظهار المفتاح">👁</button></div>
      <small>يُحفظ في متصفحك فقط (LocalStorage) ويُرسل إلى OpenRouter مباشرة. احصل على مفتاح من openrouter.ai/keys</small>
    </div>
    <div class="field">
      <label for="model">الموديل</label>
      <select id="model"></select>
      <div class="row" style="margin-top:8px"><input type="text" id="custom" placeholder="أو اكتب معرّف موديل مخصص"><button class="mini" id="useCustom">استخدم</button></div>
      <button class="mini" id="loadModels" style="margin-top:8px;width:100%">تحديث قائمة الموديلات المجانية من OpenRouter</button>
      <div class="status" id="mStatus"></div>
    </div>
    <div class="field">
      <label for="sys">تخصيص الشخصية والتعليمات (System Prompt)</label>
      <textarea id="sys"></textarea>
      <small>حدّد أسلوب المساعد وشخصيته ولغته كما تشاء. تُرسل مع كل رسالة.</small>
    </div>
    <div class="field">
      <label for="temp">الإبداع (Temperature) <em id="tv"></em></label>
      <input type="range" id="temp" min="0" max="2" step="0.1">
      <small>قيمة منخفضة = إجابات دقيقة ومتوقعة. قيمة مرتفعة = إجابات أكثر إبداعاً.</small>
    </div>
    <div class="field">
      <label for="max">طول الإجابة الأقصى (Max Tokens) <em id="mv"></em></label>
      <input type="range" id="max" min="128" max="8192" step="128">
    </div>
    <button class="mini" id="reset" style="width:100%">استعادة الإعدادات الافتراضية</button>
  </div>
</aside>
<div class="scrim" id="scrim"></div>

<main>
  <header>
    <button class="burger" id="burger" aria-label="القائمة">☰</button>
    <h2 id="title">محادثة جديدة</h2>
    <span class="model" id="hModel"></span>
  </header>
  <div id="msgs"><div class="col" id="col"></div></div>
  <div class="composer">
    <div class="box">
      <textarea id="input" rows="1" placeholder="اكتب رسالتك هنا... (Enter للإرسال، Shift+Enter لسطر جديد)"></textarea>
      <button class="send" id="send" aria-label="إرسال"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="transform:scaleX(-1)"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg></button>
    </div>
    <div class="tools"><button id="export">⬇ تصدير المحادثة</button><button id="clear">🗑 مسح المحادثة</button><button id="clearAll">مسح كل السجل</button></div>
  </div>
</main>

<script>
const $=s=>document.querySelector(s);
const DEF={key:"",model:"meta-llama/llama-3.3-70b-instruct:free",sys:"أنت «Knight AI»، مساعد ذكي فخم وودود. تجيب بالعربية الفصحى المبسطة ما لم يطلب المستخدم لغة أخرى، وتكون إجاباتك واضحة ومنظمة ودقيقة. عند كتابة الأكواد استخدم كتل الأكواد مع ذكر اللغة.",temp:0.7,max:2048};
const MODELS=[
 ["Llama 3.3 70B (مجاني)","meta-llama/llama-3.3-70b-instruct:free"],
 ["DeepSeek R1 (مجاني)","deepseek/deepseek-r1:free"],
 ["DeepSeek V3 (مجاني)","deepseek/deepseek-chat-v3-0324:free"],
 ["Qwen 2.5 72B (مجاني)","qwen/qwen-2.5-72b-instruct:free"],
 ["Mistral 7B (مجاني)","mistralai/mistral-7b-instruct:free"],
 ["Mistral Small 3.1 (مجاني)","mistralai/mistral-small-3.1-24b-instruct:free"],
 ["Gemma 2 9B (مجاني)","google/gemma-2-9b-it:free"],
 ["Llama 3.1 8B Instruct","meta-llama/llama-3.1-8b-instruct"],
 ["DeepSeek Chat (مدفوع)","deepseek/deepseek-chat"],
 ["Qwen 2.5 Coder 32B","qwen/qwen-2.5-coder-32b-instruct"],
 ["GPT-4o mini","openai/gpt-4o-mini"],
 ["Claude 3.5 Haiku","anthropic/claude-3.5-haiku"]
];
let S={chats:[],cur:null,set:{...DEF}},ctrl=null,busy=false;
try{const r=JSON.parse(localStorage.getItem("knightai")||"null");if(r){S=r;S.set={...DEF,...S.set}}}catch{}
const save=()=>{try{localStorage.setItem("knightai",JSON.stringify(S))}catch{}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const chat=()=>S.chats.find(c=>c.id===S.cur);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- Markdown ---------- */
function inline(t){
  t=esc(t);
  t=t.replace(/`([^`\n]+)`/g,'<code class="i">$1</code>');
  t=t.replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>");
  t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return t;
}
function block(txt){
  const out=[];let list=null;
  const flush=()=>{if(list){out.push(`<${list.t}>${list.i.map(x=>"<li>"+inline(x)+"</li>").join("")}</${list.t}>`);list=null}};
  txt.split("\n").forEach(l=>{
    let m;
    if(m=l.match(/^(#{1,3})\s+(.*)/)){flush();out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`)}
    else if(m=l.match(/^\s*[-*•]\s+(.*)/)){if(!list||list.t!=="ul"){flush();list={t:"ul",i:[]}}list.i.push(m[1])}
    else if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){if(!list||list.t!=="ol"){flush();list={t:"ol",i:[]}}list.i.push(m[1])}
    else if(!l.trim())flush();
    else{flush();out.push(`<p>${inline(l)}</p>`)}
  });
  flush();return out.join("");
}
function md(src){
  const parts=src.split(/(```[\s\S]*?(?:```|$))/g);
  return parts.map(p=>{
    const m=p.match(/^```(\w*)[^\n]*\n?([\s\S]*?)(?:```)?$/);
    if(p.startsWith("```")&&m){
      return `<div class="code"><div class="bar"><span>${esc(m[1]||"code")}</span><button class="copy" type="button">📋 نسخ الكود</button></div><pre><code>${esc(m[2].replace(/\n$/,""))}</code></pre></div>`;
    }
    return block(p);
  }).join("");
}

/* ---------- Render ---------- */
function renderList(){
  $("#chatList").innerHTML=S.chats.length?"":`<div class="status" style="text-align:center;padding:20px">لا توجد محادثات بعد.</div>`;
  [...S.chats].sort((a,b)=>b.ts-a.ts).forEach(c=>{
    const d=document.createElement("div");d.className="chat-item"+(c.id===S.cur?" on":"");
    d.innerHTML=`<span>${esc(c.title)}</span><button aria-label="حذف" title="حذف">✕</button>`;
    d.onclick=e=>{if(e.target.tagName==="BUTTON"){S.chats=S.chats.filter(x=>x.id!==c.id);if(S.cur===c.id)S.cur=null;save();init();return}
      S.cur=c.id;save();renderAll();closeSide()};
    $("#chatList").append(d);
  });
}
function msgEl(m,streaming){
  const d=document.createElement("div");d.className="msg "+m.role;
  d.innerHTML=`<div class="av">${m.role==="user"?"أنت":"AI"}</div><div class="body"></div>`;
  setBody(d.querySelector(".body"),m,streaming);return d;
}
function setBody(b,m,streaming){
  if(m.role==="user")b.textContent=m.content;
  else b.innerHTML=(m.error?`<div class="err">${esc(m.error)}</div>`:"")+md(m.content||"")+(streaming?'<span class="cursor"></span>':"");
}
function renderAll(){
  const c=chat(),col=$("#col");col.innerHTML="";
  $("#title").textContent=c?c.title:"محادثة جديدة";$("#hModel").textContent=S.set.model;
  if(!c||!c.msgs.length){
    col.innerHTML=`<div class="welcome"><div class="logo">K</div><h1>مرحباً بك في Knight AI Studio</h1><p>أدخل مفتاح OpenRouter من الإعدادات واختر الموديل، ثم ابدأ المحادثة.</p><div class="sugg"><button>اشرح لي الذكاء الاصطناعي ببساطة مع مثال</button><button>اكتب لي دالة JavaScript لترتيب مصفوفة كائنات</button><button>ساعدني في كتابة رسالة بريد رسمية</button><button>لخّص لي فوائد القراءة اليومية في 5 نقاط</button></div></div>`;
    col.querySelectorAll(".sugg button").forEach(b=>b.onclick=()=>{$("#input").value=b.textContent;send()});
  }else c.msgs.forEach(m=>col.append(msgEl(m)));
  renderList();scrollEnd(true);
}
const scrollEnd=f=>{const s=$("#msgs");if(f||s.scrollHeight-s.scrollTop-s.clientHeight<160)s.scrollTop=s.scrollHeight};

/* ---------- Chat ---------- */
async function send(){
  if(busy){ctrl&&ctrl.abort();return}
  const inp=$("#input"),text=inp.value.trim();if(!text)return;
  if(!S.set.key){openSet();toast("أدخل مفتاح OpenRouter أولاً");return}
  let c=chat();
  if(!c){c={id:uid(),title:"محادثة جديدة",msgs:[],ts:Date.now()};S.chats.push(c);S.cur=c.id}
  c.msgs.push({role:"user",content:text});
  if(c.msgs.length===1)c.title=text.slice(0,40);
  const a={role:"assistant",content:""};c.msgs.push(a);c.ts=Date.now();
  inp.value="";autoGrow();save();renderAll();
  const el=$("#col").lastElementChild.querySelector(".body");
  setBusy(true);ctrl=new AbortController();
  const history=c.msgs.slice(0,-1).map(({role,content})=>({role,content}));
  const msgs=S.set.sys.trim()?[{role:"system",content:S.set.sys},...history]:history;
  try{
    const r=await fetch("https://openrouter.ai/api/v1/chat/completions",{method:"POST",signal:ctrl.signal,
      headers:{"Authorization":"Bearer "+S.set.key,"Content-Type":"application/json","HTTP-Referer":location.origin&&location.origin!=="null"?location.origin:"https://knight-ai.local","X-Title":"Knight AI Studio"},
      body:JSON.stringify({model:S.set.model,messages:msgs,temperature:+S.set.temp,max_tokens:+S.set.max,stream:true})});
    if(!r.ok){let m="";try{const j=await r.json();m=j.error?.message||""}catch{}
      throw new Error(({401:"مفتاح API غير صالح.",402:"الرصيد غير كافٍ لهذا الموديل.",429:"تجاوزت حد الطلبات. انتظر قليلاً أو جرّب موديلاً آخر."})[r.status]||("خطأ "+r.status))+(m?" ("+m+")":"")}
    const rd=r.body.getReader(),dec=new TextDecoder();let buf="";
    for(;;){
      const {done,value}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split("\n");buf=lines.pop();
      for(const l of lines){
        if(!l.startsWith("data:"))continue;const d=l.slice(5).trim();if(d==="[DONE]")continue;
        try{const j=JSON.parse(d);
          if(j.error)throw new Error(j.error.message||"خطأ من المزود");
          const t=j.choices?.[0]?.delta?.content;if(t){a.content+=t;setBody(el,a,true);scrollEnd()}
        }catch(e){if(e.message&&!(e instanceof SyntaxError))throw e}
      }
    }
    if(!a.content)a.error="لم يصل أي رد من الموديل. جرّب موديلاً آخر.";
  }catch(e){
    if(e.name==="AbortError")a.content=a.content||"(أُوقف التوليد)";
    else a.error=e.message==="Failed to fetch"?"تعذّر الاتصال بـ OpenRouter. تحقق من الإنترنت.":e.message;
  }
  setBusy(false);setBody(el,a,false);save();scrollEnd();
}
function setBusy(b){busy=b;const s=$("#send");s.classList.toggle("stop",b);
  s.innerHTML=b?'<svg viewBox="0 0 24 24" fill="#fff"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="transform:scaleX(-1)"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>';
  s.setAttribute("aria-label",b?"إيقاف":"إرسال")}

/* ---------- Input ---------- */
const autoGrow=()=>{const i=$("#input");i.style.height="auto";i.style.height=Math.min(i.scrollHeight,200)+"px"};
$("#input").addEventListener("input",autoGrow);
$("#input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
$("#send").onclick=send;

/* Copy code */
$("#col").addEventListener("click",async e=>{
  const b=e.target.closest(".copy");if(!b)return;
  const code=b.closest(".code").querySelector("code").textContent;
  try{await navigator.clipboard.writeText(code)}catch{const t=document.createElement("textarea");t.value=code;document.body.append(t);t.select();document.execCommand("copy");t.remove()}
  b.classList.add("done");b.textContent="✓ تم النسخ";setTimeout(()=>{b.classList.remove("done");b.textContent="📋 نسخ الكود"},1800);
});

/* Export / clear */
$("#export").onclick=()=>{
  const c=chat();if(!c||!c.msgs.length){toast("لا توجد محادثة لتصديرها");return}
  const t=`# ${c.title}\n\n`+c.msgs.map(m=>`## ${m.role==="user"?"أنت":"Knight AI"}\n\n${m.content}\n`).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/markdown;charset=utf-8"}));
  a.download=c.title.replace(/[\\/:*?"<>|]/g,"").trim().slice(0,40)+".md";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
};
$("#clear").onclick=()=>{const c=chat();if(!c)return;if(confirm("مسح هذه المحادثة؟")){S.chats=S.chats.filter(x=>x.id!==c.id);S.cur=null;save();renderAll()}};
$("#clearAll").onclick=()=>{if(confirm("مسح كل سجل المحادثات؟ لا يمكن التراجع.")){S.chats=[];S.cur=null;save();renderAll()}};
$("#newChat").onclick=()=>{S.cur=null;renderAll();closeSide();$("#input").focus()};

/* ---------- Settings ---------- */
function fillModels(list){
  const sel=$("#model");sel.innerHTML="";
  const ids=new Set(list.map(m=>m[1]));
  if(!ids.has(S.set.model))list=[[S.set.model,S.set.model],...list];
  list.forEach(([n,id])=>{const o=document.createElement("option");o.value=id;o.textContent=n;sel.append(o)});
  sel.value=S.set.model;
}
function syncSet(){
  $("#key").value=S.set.key;$("#sys").value=S.set.sys;
  $("#temp").value=S.set.temp;$("#tv").textContent=(+S.set.temp).toFixed(1);
  $("#max").value=S.set.max;$("#mv").textContent=S.set.max;
  fillModels(MODELS);$("#hModel").textContent=S.set.model;
}
$("#key").oninput=e=>{S.set.key=e.target.value.trim();save()};
$("#eye").onclick=()=>{const k=$("#key");k.type=k.type==="password"?"text":"password"};
$("#model").onchange=e=>{S.set.model=e.target.value;save();$("#hModel").textContent=S.set.model};
$("#useCustom").onclick=()=>{const v=$("#custom").value.trim();if(!v)return;S.set.model=v;save();fillModels(MODELS);$("#hModel").textContent=v;$("#custom").value="";toast("تم اختيار الموديل")};
$("#sys").oninput=e=>{S.set.sys=e.target.value;save()};
$("#temp").oninput=e=>{S.set.temp=e.target.value;$("#tv").textContent=(+e.target.value).toFixed(1);save()};
$("#max").oninput=e=>{S.set.max=e.target.value;$("#mv").textContent=e.target.value;save()};
$("#reset").onclick=()=>{const k=S.set.key;S.set={...DEF,key:k};save();syncSet();toast("تمت الاستعادة")};
$("#loadModels").onclick=async()=>{
  const st=$("#mStatus");st.textContent="جارٍ التحميل...";
  try{
    const r=await fetch("https://openrouter.ai/api/v1/models"),j=await r.json();
    const free=j.data.filter(m=>m.id.endsWith(":free")).map(m=>[m.name.replace(/\s*\(free\)/i,"")+" (مجاني)",m.id]).sort((a,b)=>a[0].localeCompare(b[0]));
    const extra=MODELS.filter(m=>!m[1].endsWith(":free"));
    fillModels([...free,...extra]);st.textContent=`تم تحميل ${free.length} موديل مجاني.`;
  }catch{st.textContent="تعذّر تحميل القائمة. تحقق من الاتصال."}
};

/* Tabs / sidebar / toast */
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>showTab(b.dataset.t));
function showTab(t){document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x.dataset.t===t));$("#p-chats").classList.toggle("on",t==="chats");$("#p-set").classList.toggle("on",t==="set")}
const openSet=()=>{showTab("set");$("#side").classList.add("open");$("#scrim").classList.add("show")};
const closeSide=()=>{$("#side").classList.remove("open");$("#scrim").classList.remove("show")};
$("#burger").onclick=()=>{$("#side").classList.add("open");$("#scrim").classList.add("show")};
$("#scrim").onclick=closeSide;
function toast(t){const d=document.createElement("div");d.textContent=t;d.style.cssText="position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#1f2438;border:1px solid var(--line);padding:10px 18px;border-radius:12px;z-index:99;font-size:.9rem";document.body.append(d);setTimeout(()=>d.remove(),2400)}

function init(){syncSet();renderAll()}
init();
</script>
</body>
</html>
